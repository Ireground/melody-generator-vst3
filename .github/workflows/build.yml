name: Build VST3 (Windows)

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Melody-Generator-VST3-Windows
          path: build/MelodyGenerator_artefacts/Release/VST3/*.vst3
          if-no-files-found: error
